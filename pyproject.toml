[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dvae-bss"
version = "0.1.0"
description = "Dynamical variational auto-encoding for unsupervised blind sound separation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Julian Neri", email = "43224513+jundsp@users.noreply.github.com" }]
dependencies = [
    "numpy",
    "pyyaml",
    "scipy",
    "soundfile",
    "torch",
    "tqdm",
]

[project.scripts]
dvae-train = "dvae_bss.cli.train:main"
dvae-separate = "dvae_bss.cli.separate:main"
dvae-evaluate = "dvae_bss.cli.evaluate:main"
dvae-make-synthetic = "dvae_bss.datagen.synthetic:main"
dvae-make-twonote = "dvae_bss.datagen.twonote:main"

[project.optional-dependencies]
plots = ["matplotlib"]
# Training plots, plus TensorBoard (tensorboard: true in a dvae-train config).
monitor = ["matplotlib", "tensorboard"]
experiments = ["matplotlib", "pandas", "scikit-learn", "seaborn"]
dev = ["matplotlib", "pytest", "ruff", "tensorboard"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "TID", "ANN"]
# ANN401: ``Any`` is fine for **kwargs passed through to another function.
ignore = ["D105", "D107", "ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"experiments/*" = ["D103"]
"src/dvae_bss/layers.py" = ["D102"]  # forward() of small building blocks
